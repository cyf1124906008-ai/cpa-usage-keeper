name: CPA2 deploy

on:
  push:
    paths:
      - ".github/workflows/cpa2-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSHPASS: ${{ secrets.CPA2_ROOT_PASSWORD }}
    steps:
      - name: Check out keeper source
        uses: actions/checkout@v4

      - name: Install SSH password helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Prepare CPA2 package
        shell: bash
        env:
          CPA2_API_KEY: ${{ secrets.CPA2_API_KEY }}
          CPA2_MANAGEMENT_KEY: ${{ secrets.CPA2_MANAGEMENT_KEY }}
          CPA2_MANAGEMENT_HASH: ${{ secrets.CPA2_MANAGEMENT_HASH }}
          CPA2_LOGIN_PASSWORD: ${{ secrets.CPA2_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CPA2_API_KEY"
          test -n "$CPA2_MANAGEMENT_KEY"
          test -n "$CPA2_MANAGEMENT_HASH"
          test -n "$CPA2_LOGIN_PASSWORD"

          package=/tmp/cpa2-package
          rm -rf "$package"
          mkdir -p "$package/normalizer"

          tar             --exclude=.git             --exclude='.github/workflows/cpa2-*.yml'             -czf "$package/source.tar.gz" .

          printf '%s' '' | base64 -d > "$package/normalizer/main.go"
          printf '%s' '' | base64 -d > "$package/normalizer/Dockerfile"
          printf '%s' 'bW9kdWxlIGNwYS1yZXNwb25zZXMtbm9ybWFsaXplcgoKZ28gMS4yNQo=' | base64 -d > "$package/normalizer/go.mod"

          cat > "$package/config.yaml" <<CONFIG
          host: ""
          port: 8317
          auth-dir: "/root/.cli-proxy-api"
          api-keys:
            - "$CPA2_API_KEY"
          debug: false
          logging-to-file: true
          usage-statistics-enabled: true
          redis-usage-queue-retention-seconds: 3600
          request-retry: 3
          routing:
            strategy: "round-robin"
          remote-management:
            allow-remote: true
            secret-key: "$CPA2_MANAGEMENT_HASH"
          CONFIG

          cat > "$package/.env" <<ENV
          CPA2_MANAGEMENT_KEY=$CPA2_MANAGEMENT_KEY
          CPA2_LOGIN_PASSWORD=$CPA2_LOGIN_PASSWORD
          ENV

          cat > "$package/docker-compose.yml" <<'COMPOSE'
          services:
            cli-proxy-api:
              image: eceasy/cli-proxy-api:latest
              container_name: cpa2
              restart: unless-stopped
              expose:
                - "8317"
              volumes:
                - ./config.yaml:/CLIProxyAPI/config.yaml:ro
                - ./auths:/root/.cli-proxy-api
                - ./logs:/CLIProxyAPI/logs
              environment:
                - TZ=Asia/Shanghai

            cpa-responses-normalizer:
              build:
                context: ./normalizer
              image: cpa2-responses-normalizer:local
              container_name: cpa2-responses-normalizer
              restart: unless-stopped
              depends_on:
                - cli-proxy-api
              expose:
                - "8320"
              environment:
                - TZ=Asia/Shanghai
                - LISTEN_ADDR=:8320
                - UPSTREAM_URL=http://cli-proxy-api:8317

            cpa-gateway:
              image: nginx:1.29-alpine
              container_name: cpa2-gateway
              restart: unless-stopped
              depends_on:
                cpa-responses-normalizer:
                  condition: service_healthy
              ports:
                - "3000:3000"
              volumes:
                - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

            cpa-usage-keeper:
              build:
                context: ./source
                args:
                  VERSION: cpa2
              image: cpa-usage-keeper:cpa2
              container_name: cpa2-usage-keeper
              restart: unless-stopped
              depends_on:
                - cli-proxy-api
                - cpa-responses-normalizer
              ports:
                - "80:8080"
              environment:
                TZ: Asia/Shanghai
                CPA_BASE_URL: http://cli-proxy-api:8317
                CPA_PUBLIC_URL: http://47.251.143.204:3000
                CPA_MANAGEMENT_KEY: ${CPA2_MANAGEMENT_KEY}
                REDIS_QUEUE_ADDR: cli-proxy-api:8317
                RUNTIME_METRICS_URL: http://cpa-responses-normalizer:8320/normalizer/metrics
                AUTH_ENABLED: "true"
                LOGIN_PASSWORD: ${CPA2_LOGIN_PASSWORD}
                ESTIMATE_MISSING_USAGE: "true"
                ESTIMATED_NON_CACHED_INPUT_TOKENS: "1582"
                ESTIMATED_CACHED_INPUT_TOKENS: "109056"
                ESTIMATED_OUTPUT_TOKENS: "320"
                LOG_RETENTION_DAYS: "30"
                BACKUP_ENABLED: "true"
                BACKUP_INTERVAL: "24h"
                BACKUP_RETENTION_DAYS: "14"
              volumes:
                - ./keeper:/data
          COMPOSE

          cat > "$package/nginx.conf" <<'NGINX'
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ""      "";
          }

          server {
              listen 3000;
              server_name _;
              client_max_body_size 0;

              location / {
                  proxy_pass http://cpa-responses-normalizer:8320;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;

                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_cache off;
                  proxy_ignore_client_abort on;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
          }
          NGINX

          tar -C /tmp -czf /tmp/cpa2-deploy.tar.gz cpa2-package

      - name: Upload CPA2 package
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e scp             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=15             /tmp/cpa2-deploy.tar.gz             root@47.251.143.204:/tmp/cpa2-deploy.tar.gz

      - name: Install and start CPA2
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=15             root@47.251.143.204 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if ! command -v docker >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl
            curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
            if ! sh /tmp/get-docker.sh; then
              apt-get install -y docker.io docker-compose-v2
            fi
          fi

          systemctl enable --now docker
          docker compose version

          rm -rf /tmp/cpa2-package
          tar -xzf /tmp/cpa2-deploy.tar.gz -C /tmp
          install -d -m 700 /opt/cpa2
          cp -a /tmp/cpa2-package/. /opt/cpa2/

          rm -rf /opt/cpa2/source
          mkdir -p /opt/cpa2/source
          tar -xzf /opt/cpa2/source.tar.gz -C /opt/cpa2/source
          mkdir -p /opt/cpa2/auths /opt/cpa2/logs /opt/cpa2/keeper
          chmod 600 /opt/cpa2/config.yaml /opt/cpa2/.env

          cd /opt/cpa2
          docker compose up -d --build --remove-orphans

          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1/healthz >/dev/null 2>&1 &&                curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done

          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --tail=250
            exit 1
          fi

          echo "=== CPA2 SERVICES ==="
          docker compose ps
          echo "=== HEALTH ==="
          curl -fsS http://127.0.0.1/healthz
          echo
          curl -fsS http://127.0.0.1:3000/
          echo
          REMOTE
