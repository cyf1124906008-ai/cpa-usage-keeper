name: CPA2 public routing

on:
  push:
    paths:
      - ".github/workflows/cpa2-route.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.CPA2_ROOT_PASSWORD }}
    steps:
      - name: Install SSH password helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Prepare public routing
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/docker-compose.yml <<'COMPOSE'
          services:
            cli-proxy-api:
              image: eceasy/cli-proxy-api:latest
              container_name: cpa2
              restart: unless-stopped
              expose:
                - "8317"
              volumes:
                - ./config.yaml:/CLIProxyAPI/config.yaml:ro
                - ./auths:/root/.cli-proxy-api
                - ./logs:/CLIProxyAPI/logs
              environment:
                - TZ=Asia/Shanghai

            cpa-responses-normalizer:
              build:
                context: ./normalizer
              image: cpa2-responses-normalizer:local
              container_name: cpa2-responses-normalizer
              restart: unless-stopped
              depends_on:
                - cli-proxy-api
              expose:
                - "8320"
              environment:
                - TZ=Asia/Shanghai
                - LISTEN_ADDR=:8320
                - UPSTREAM_URL=http://cli-proxy-api:8317

            cpa-gateway:
              image: nginx:1.29-alpine
              container_name: cpa2-gateway
              restart: unless-stopped
              depends_on:
                cpa-responses-normalizer:
                  condition: service_healthy
                cpa-usage-keeper:
                  condition: service_healthy
              ports:
                - "80:80"
                - "3000:3000"
              volumes:
                - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

            cpa-usage-keeper:
              build:
                context: ./source
                args:
                  VERSION: cpa2
              image: cpa-usage-keeper:cpa2
              container_name: cpa2-usage-keeper
              restart: unless-stopped
              depends_on:
                - cli-proxy-api
                - cpa-responses-normalizer
              expose:
                - "8080"
              environment:
                TZ: Asia/Shanghai
                CPA_BASE_URL: http://cli-proxy-api:8317
                CPA_PUBLIC_URL: http://47.251.143.204
                CPA_MANAGEMENT_KEY: ${CPA2_MANAGEMENT_KEY}
                REDIS_QUEUE_ADDR: cli-proxy-api:8317
                RUNTIME_METRICS_URL: http://cpa-responses-normalizer:8320/normalizer/metrics
                AUTH_ENABLED: "true"
                LOGIN_PASSWORD: ${CPA2_LOGIN_PASSWORD}
                ESTIMATE_MISSING_USAGE: "true"
                ESTIMATED_NON_CACHED_INPUT_TOKENS: "1582"
                ESTIMATED_CACHED_INPUT_TOKENS: "109056"
                ESTIMATED_OUTPUT_TOKENS: "320"
                LOG_RETENTION_DAYS: "30"
                BACKUP_ENABLED: "true"
                BACKUP_INTERVAL: "24h"
                BACKUP_RETENTION_DAYS: "14"
              volumes:
                - ./keeper:/data
          COMPOSE

          cat > /tmp/nginx.conf <<'NGINX'
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ""      "";
          }

          upstream cpa2_api {
              server cpa-responses-normalizer:8320;
              keepalive 256;
          }

          upstream cpa2_keeper {
              server cpa-usage-keeper:8080;
              keepalive 64;
          }

          server {
              listen 80;
              server_name _;
              client_max_body_size 0;

              location ^~ /v1/ {
                  proxy_pass http://cpa2_api;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_cache off;
                  proxy_ignore_client_abort on;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              location = /management.html {
                  proxy_pass http://cpa2_api;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_buffering off;
              }

              location ^~ /v0/ {
                  proxy_pass http://cpa2_api;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              location / {
                  proxy_pass http://cpa2_keeper;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_buffering off;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
          }

          server {
              listen 3000;
              server_name _;
              client_max_body_size 0;

              location / {
                  proxy_pass http://cpa2_api;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_cache off;
                  proxy_ignore_client_abort on;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
          }
          NGINX

      - name: Apply public routing
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e scp             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=15             /tmp/docker-compose.yml /tmp/nginx.conf             root@47.251.143.204:/tmp/

          sshpass -e ssh             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=15             root@47.251.143.204 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -m 600 /tmp/docker-compose.yml /opt/cpa2/docker-compose.yml
          install -m 644 /tmp/nginx.conf /opt/cpa2/nginx.conf

          cd /opt/cpa2
          docker compose up -d --force-recreate cpa-usage-keeper cpa-gateway

          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1/healthz >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --tail=150 cpa-gateway cpa-usage-keeper
            exit 1
          fi

          api_key=$(awk -F'"' '/- "/ {print $2; exit}' config.yaml)
          curl -fsS -H "Authorization: Bearer $api_key" http://127.0.0.1/v1/models >/dev/null

          echo "=== PUBLIC ROUTING ==="
          docker compose ps
          curl -fsS http://127.0.0.1/healthz
          echo
          echo "OpenAI-compatible /v1 route: ok"
          REMOTE
